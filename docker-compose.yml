version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: travel_qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  travel_agent_api:
    build: .
    container_name: travel_planning_agent
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=http://qdrant:6333
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_storage:
